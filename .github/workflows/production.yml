name: Build & deploy production
on:
  push:
    branches:
      - 'master'
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 7822
          script: |
            set -euo pipefail
            cd ${{ secrets.PRODUCTION_DIR }}
            pwd
            chmod a+w web/sites/default
            chmod a+w web/sites/default/settings.php
            git reset --hard
            git fetch origin
            git checkout -B master origin/master
            ${{ secrets.COMPOSER }} install --no-dev --ignore-platform-reqs
            ln -sfn ../../../../files web/sites/default/files
            chmod a-w web/sites/default
            chmod a-w web/sites/default/settings.php
            # Guard: refuse to deploy when the remote active config has drift
            # not present in git config/sync/. cim would silently overwrite
            # those changes. Run the cex-remote workflow to snapshot them
            # into a PR first, then merge and redeploy (bead doesdesign-wefm).
            DRIFT=$(LANGUAGE=en bin/drush --uri=https://doesdesign.nl config:status --state='different,only in db' --format=list 2>/dev/null | grep -c . || true)
            if [ "$DRIFT" -gt 0 ]; then
              echo "::error::Remote production config has $DRIFT item(s) differing from git config/sync/. Run 'gh workflow run cex-remote.yml -f environment=production' to snapshot the drift, then merge that PR before redeploying."
              LANGUAGE=en bin/drush --uri=https://doesdesign.nl config:status --state='different,only in db' || true
              exit 1
            fi
            LANGUAGE=en bin/drush --uri=https://doesdesign.nl deploy
            LANGUAGE=en bin/drush --uri=https://doesdesign.nl st
