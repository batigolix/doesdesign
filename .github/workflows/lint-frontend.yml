# AI generated (bead ouva)
name: Frontend lint

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  lint:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - eslint
          - stylelint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install linters
        run: |
          case "${{ matrix.tool }}" in
            eslint)
              npm install --no-save eslint@^8
              ;;
            stylelint)
              npm install --no-save stylelint stylelint-config-standard-scss
              ;;
          esac

      - name: Run eslint
        if: matrix.tool == 'eslint'
        run: npx eslint --no-eslintrc -c .eslintrc.json 'web/modules/custom/**/*.js' 'web/themes/custom/shindo/**/*.js' --no-error-on-unmatched-pattern

      - name: Run stylelint
        if: matrix.tool == 'stylelint'
        run: npx stylelint 'web/themes/custom/shindo/**/*.{css,scss}' --allow-empty-input
