# AI generated (bead doesdesign-d6iy).
name: Locale check

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  po-syntax:
    name: Validate .po files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      # Validate syntax of .po files under custom code paths.
      # Excludes:
      #   - vendor/ and node_modules/ (third-party).
      #   - web/core/ (upstream Drupal, includes intentionally malformed
      #     test fixtures).
      #   - web/sites/default/files/ (runtime translation cache, not
      #     tracked in git).
      - name: Check .po file syntax
        run: |
          set -euo pipefail
          mapfile -t po_files < <(find . -name '*.po' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './web/core/*' \
            -not -path './web/sites/default/files/*')

          if [ "${#po_files[@]}" -eq 0 ]; then
            echo "No .po files to validate."
            exit 0
          fi

          echo "Validating ${#po_files[@]} .po file(s):"
          printf '  %s\n' "${po_files[@]}"

          for po in "${po_files[@]}"; do
            echo "::group::$po"
            msgfmt --check --statistics -o /dev/null "$po"
            echo "::endgroup::"
          done
