name: Build & deploy stage
on:
  push:
    branches:
      - 'develop'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring
          coverage: none

      - name: Get composer version
        run: composer --version

      - name: Composer validate
        run: composer validate

      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composercache.outputs.dir }}
          # Use composer.json for key, if composer.lock is not committed.
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --quiet --ignore-platform-reqs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 7822
          debug: true
          script: |
            set -e
            cd ${{ secrets.STAGE_DIR }}
            pwd
            chmod a+w web/sites/default
            chmod a+w web/sites/default/settings.php
            git reset --hard
            git fetch origin
            git checkout -B develop origin/develop
            ${{ secrets.COMPOSER }} install --prefer-dist --no-progress --no-suggest --quiet --ignore-platform-reqs
            chmod a-w web/sites/default
            chmod a-w web/sites/default/settings.php
            # Guard: refuse to deploy when the remote active config has drift
            # not present in git config/sync/. cim would silently overwrite
            # those changes. Run the cex-remote workflow to snapshot them
            # into a PR first, then merge and redeploy (bead doesdesign-wefm).
            DRIFT=$(LANGUAGE=en bin/drush config:status --state='different,only in db' --format=list 2>/dev/null | grep -c . || true)
            if [ "$DRIFT" -gt 0 ]; then
              echo "::error::Remote stage config has $DRIFT item(s) differing from git config/sync/. Run 'gh workflow run cex-remote.yml -f environment=stage' to snapshot the drift, then merge that PR before redeploying."
              LANGUAGE=en bin/drush config:status --state='different,only in db' || true
              exit 1
            fi
            LANGUAGE=en bin/drush deploy
            LANGUAGE=en bin/drush st
