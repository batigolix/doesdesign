# AI generated
shindo.settings:
  type: theme_settings
  label: 'Shindo theme settings'
  mapping:
    body_font:
      type: string
      label: 'Body font'
      constraints:
        Choice:
          choices:
            - source-sans-pro
            - lora
            - roboto
            - system
            - merriweather
            - playfair-display
            - nunito
            - open-sans
            - montserrat
            - poppins
    primary_color:
      type: color_hex
      label: 'Hoofdkleur'
    button_color:
      type: color_hex
      label: 'Button color'
    footer_button_color:
      type: color_hex
      label: 'Footer button color'
    footer_heading_color:
      type: color_hex
      label: 'Footer heading color'
    accent_color:
      type: color_hex
      label: 'Accent color (Dopetrope pink)'
    background_pattern:
      type: string
      label: 'Background pattern'
      constraints:
        Choice:
          choices:
            - bg
            - none
            - stripes
            - grid
    background_color:
      type: color_hex
      label: 'Background color'
    color_primary:
      type: color_hex
      label: 'Color primary (HSL derivation)'
    color_secondary:
      type: color_hex
      label: 'Color secondary'
    color_accent:
      type: color_hex
      label: 'Color accent'
    color_background:
      type: color_hex
      label: 'Color background'
    color_text:
      type: color_hex
      label: 'Color text'
    container_width:
      type: string
      label: 'Container width'
      constraints:
        Choice:
          choices: [narrow, default, wide]
    sidebar_position:
      type: string
      label: 'Sidebar position'
      constraints:
        Choice:
          choices: [left, right, none]
    show_hero:
      type: boolean
      label: 'Show hero'
    body_font_size:
      type: integer
      label: 'Body font size (%)'
      constraints:
        Range: { min: 50, max: 200 }
    heading_font_size:
      type: integer
      label: 'Heading font size (%)'
      constraints:
        Range: { min: 50, max: 200 }
