# AI generated
shindo.settings:
  type: theme_settings
  label: 'Shindo theme settings'
  mapping:
    color_primary:
      type: color_hex
      label: 'Primary color'
    color_secondary:
      type: color_hex
      label: 'Secondary color'
    color_accent:
      type: color_hex
      label: 'Accent color'
    color_background:
      type: color_hex
      label: 'Background color'
    color_text:
      type: color_hex
      label: 'Text color'
    container_width:
      type: string
      label: 'Container width'
      constraints:
        Choice:
          choices:
            - narrow
            - default
            - wide
    sidebar_position:
      type: string
      label: 'Sidebar position'
      constraints:
        Choice:
          choices:
            - left
            - right
            - none
    show_hero:
      type: boolean
      label: 'Show hero on front page'
