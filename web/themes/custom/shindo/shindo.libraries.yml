global-styling:
  version: 1.x
  css:
    theme:
      # External Google Fonts stylesheet (bead doesdesign-ig9). Consolidated
      # from previous @import statements in shindo-fonts.css into a single
      # non-blocking request. Preconnect hints are attached via
      # shindo_page_attachments() in shindo.theme.
      'https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Roboto:wght@300;400;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&display=swap': { type: external, minified: true }
      assets/css/main.css: {}
      assets/css/shindo-fonts.css: {}
      assets/css/shindo-overrides.css: {}
      assets/css/shindo-colors.css: {}
      assets/css/shindo-bg.css: {}

font-awesome:
  version: 1.x
  css:
    theme:
      assets/css/fontawesome-all.min.css: { minified: true }

responsive-menu:
  version: 1.x
  js:
    assets/js/jquery.dropotron.min.js: { minified: true }
    assets/js/browser.min.js: { minified: true }
    assets/js/breakpoints.min.js: { minified: true }
    assets/js/util.js: {}
    assets/js/main.js: {}
  dependencies:
    - core/jquery
