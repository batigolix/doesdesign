doesdesign_tools.contact_form:
  path: '/doesdesign_tools/form/contact'
  defaults:
    _form: '\Drupal\doesdesign_tools\Form\ContactForm'
    _title: 'ContactForm'
  requirements:
    # Public contact form: intentionally accessible to anonymous visitors.
    _access: 'TRUE'

doesdesign_tools.home:
  path: '/home'
  defaults:
    _controller: '\Drupal\doesdesign_tools\Controller\HomeController::render'
    _title: ''
  requirements:
    # Public homepage alias: intentionally accessible to anonymous visitors.
    _access: 'TRUE'
